<!doctype html>
<html lang="en">

  <title>Greyveil Connect Requests — Admin</title>

<body class="admin-page">

    <header class="community-admin-header">
      <div><p class="admin-eyebrow">GREYVEIL · CONNECT</p><h1>Community requests</h1><p>Private requests submitted through Greyveil Connect.</p></div>
