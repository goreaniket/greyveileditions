name: Supabase production audit

on:
  workflow_dispatch:
    inputs:
      execute_readonly_checks:
        description: Run read-only target schema, grants, RLS and storage checks
        required: true
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate exact production target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SUPABASE_URL" != "https://fanixwnyglkvkgsxxrtn.supabase.co" ]]; then
            echo "The GitHub Supabase URL secret does not target fanixwnyglkvkgsxxrtn."
            exit 2
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "The GitHub service-role secret is unavailable."
            exit 2
          fi
          echo "Target URL and service-role secret are configured."

      - name: Run live read-only checks
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          for path in \
            "rest/v1/books?select=id&limit=1" \
            "rest/v1/rpc/greyveil_public_catalog" \
            "rest/v1/cms_pages?select=id&limit=1" \
            "storage/v1/bucket"
          do
            code=$(curl -sS -o /tmp/supabase-audit.json -w "%{http_code}" \
              "${headers[@]}" "$SUPABASE_URL/$path")
            printf '%s HTTP %s\n' "$path" "$code"
          done

      - name: Test direct SQL endpoint availability
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pg-query.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"select current_database() as database_name, current_user as database_user"}' \
            "$SUPABASE_URL/pg/query")
          echo "pg/query HTTP $code"
