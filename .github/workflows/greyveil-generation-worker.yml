name: Greyveil generation worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Generation or publication job UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: greyveil-generation-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate job UUID and process it
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "job_id must be a canonical lowercase UUID." >&2
            exit 2
          fi
          python tools/book-generator/run_generation_worker.py --job "$JOB_ID"
