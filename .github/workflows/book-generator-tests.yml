name: Book generator worker tests

on:
  pull_request:
    paths:
      - "tools/book-generator/**"
      - "requirements.txt"
      - ".github/workflows/book-generator-tests.yml"
  push:
    branches:
      - master
    paths:
      - "tools/book-generator/**"
      - "requirements.txt"
      - ".github/workflows/book-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-generator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run complete book-generator test suite
        run: python -m unittest discover -s tools/book-generator/tests -v
