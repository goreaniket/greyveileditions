<p class="reader-paragraph">The Last Shift.</p>
<p class="reader-paragraph">Jahan tum life ko nahi badalte…</p>
<p class="reader-paragraph">tum uske against ladna band kar dete ho.</p>
<p class="reader-paragraph">Aur pehli baar…</p>
<p class="reader-paragraph">tumhe lagta hai tum pahunch gaye ho.</p>
<p class="reader-paragraph">Kahin nahi…</p>
<p class="reader-paragraph">bas apne andar.</p>
