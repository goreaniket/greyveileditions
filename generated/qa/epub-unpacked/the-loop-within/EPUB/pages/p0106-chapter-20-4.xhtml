<p class="reader-paragraph">Aur us moment pe… </p>
<p class="reader-paragraph">“move on” ek goal nahi rehta. </p>
<p class="reader-paragraph">wo bas ek side-effect ban jata hai… </p>
<p class="reader-paragraph">jab tu repetition ko feed karna band kar deta hai. </p>
<p class="reader-paragraph">Tu stuck kisi insaan mein kabhi tha hi nahi… </p>
<p class="reader-paragraph">Tu stuck tha us meaning mein… </p>
<p class="reader-paragraph">jo tu har baar us insaan ko de raha tha. </p>
<p class="reader-paragraph">— LALIT R MISHRA</p>
