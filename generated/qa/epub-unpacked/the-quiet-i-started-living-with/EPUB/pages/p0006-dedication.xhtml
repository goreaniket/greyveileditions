<p class="unit-kicker">DEDICATION</p>
<h1>DEDICATION</h1>
</header>
<section class="flow-frame flow-frame--first">
<p class="dedication-text">To the version of me that kept going without </p>
<p class="dedication-text">understanding anything… and still never stopped showing </p>
<p class="dedication-text">up.   </p>
<p class="dedication-text">To the silence that stayed with me when I </p>
<p class="dedication-text">couldn’t explain myself to anyone.   </p>
<p class="dedication-text">And to the part of me that  </p>
<p class="dedication-text">didn’t break loudly… just slowly </p>
<p class="dedication-text">became quiet.    </p>
</section>

</main>
