<p class="reader-paragraph">Jaise saalon tak bhaagne ke baad...</p>
<p class="reader-paragraph">tum pehli baar chalna shuru karo.</p>
<p class="reader-paragraph">Jaise saalon tak future mein jeene ke baad...</p>
<p class="reader-paragraph">tum pehli baar present ko notice karo.</p>
<p class="reader-paragraph">Aur shayad wahi moment hota hai...</p>
<p class="reader-paragraph">jab search khatam nahi hoti.</p>
<p class="reader-paragraph">Bas uska burden khatam ho jata hai.</p>
