<section class="flow-frame flow-frame--continuation">
<p class="dedication-text">May you find moments of clarity in confusion.</p>
<p class="dedication-text">Peace in uncertainty.</p>
<p class="dedication-text">And meaning beyond the stories you have been told.</p>
<p class="dedication-text">Most of all...</p>
<p class="dedication-text">May you remember that being human was never something you needed to earn.</p>
<p class="dedication-text">It was always something you already were.</p>
</section>
