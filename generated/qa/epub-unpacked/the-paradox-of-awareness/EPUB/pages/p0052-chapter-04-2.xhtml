<p class="reader-paragraph">Aur yahin se chapter start hota hai.</p>
<p class="reader-paragraph"><strong>PART I — THE FIRST FRACTURE OF “ME”</strong></p>
<p class="reader-paragraph">Bachpan mein “main” simple hota hai.</p>
<p class="reader-paragraph">Naam hota hai. Face hota hai. Ek feeling hoti hai.</p>
<p class="reader-paragraph">Phir duniya aati hai.</p>
<p class="reader-paragraph">Log batate hain:</p>
<blockquote class="reader-quote">“Tu aisa hai”</blockquote>
<blockquote class="reader-quote">“Tu aisa nahi kar sakta”</blockquote>
<blockquote class="reader-quote">“Tu yeh banega”</blockquote>
