<p class="reader-paragraph">toh wo sirf narrative ban jati hai.</p>
<p class="reader-paragraph">Aur narrative ke andar rehkar bhi…</p>
<p class="reader-paragraph">ek quiet gap hamesha available hota hai.</p>
<p class="reader-paragraph">jahan koi “I” actively present nahi hota.</p>
<p class="reader-paragraph">Bas happening hoti hai.</p>
<p class="reader-paragraph">Without owner.</p>
<p class="reader-paragraph">Without center.</p>
<p class="reader-paragraph">Without claim.</p>
