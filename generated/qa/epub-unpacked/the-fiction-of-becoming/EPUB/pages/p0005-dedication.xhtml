<h1>DEDICATION</h1>
</header>
<section class="flow-frame flow-frame--first">
<p class="dedication-text">Dedicated to those who think too deeply…</p>
<p class="dedication-text">feel too silently…</p>
<p class="dedication-text">and still continue to search for meaning inside everything.</p>
<p class="dedication-text">And to the part of every mind that once asked:</p>
<p class="dedication-text">“Who am I… really?”</p>
<p class="dedication-text">Even when no answer felt enough.</p>
</section>
