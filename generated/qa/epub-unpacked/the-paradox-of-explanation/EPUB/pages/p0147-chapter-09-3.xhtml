<blockquote class="reader-quote">“I made a mistake.”</blockquote>
<p class="reader-paragraph">You say:</p>
<blockquote class="reader-quote">“I always mess things up.”</blockquote>
<p class="reader-paragraph">You don’t say:</p>
<blockquote class="reader-quote">“I felt rejected.”</blockquote>
<p class="reader-paragraph">You say:</p>
<blockquote class="reader-quote">“People don’t choose me.”</blockquote>
<p class="reader-paragraph">And in this small shift…</p>
<p class="reader-paragraph">experience becomes identity.</p>
