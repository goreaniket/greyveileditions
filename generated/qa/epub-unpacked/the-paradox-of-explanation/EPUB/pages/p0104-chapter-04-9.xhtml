<section class="flow-frame flow-frame--continuation">
<blockquote class="reader-quote">“How do I control this?”</blockquote>
<p class="reader-paragraph">But:</p>
<blockquote class="reader-quote">“Why am I trying to control something that was never mine to hold?”</blockquote>
<p class="reader-paragraph">And in that question…</p>
<p class="reader-paragraph">the illusion begins to dissolve.</p>
<p class="reader-paragraph">Not fully.</p>
<p class="reader-paragraph">Not instantly.</p>
<p class="reader-paragraph">But enough to see the gap.</p>
<p class="reader-paragraph">Between life as it is…</p>
<p class="reader-paragraph">and life as the mind tries to manage it.</p>
</section>
