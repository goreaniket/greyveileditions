<p class="reader-paragraph">And even silence…</p>
<p class="reader-paragraph">does not belong to you anymore.</p>
<p class="reader-paragraph">Because it was never yours.</p>
<p class="reader-paragraph">It was always what remained…</p>
<p class="reader-paragraph">when nothing was being added to it.</p>
