<section class="flow-frame flow-frame--continuation">
<blockquote class="reader-quote">“But what if staying is worse?”</blockquote>
<p class="reader-paragraph">Then:</p>
<blockquote class="reader-quote">“Maybe I am overthinking.”</blockquote>
<p class="reader-paragraph">Then again:</p>
<blockquote class="reader-quote">“But what if I am ignoring intuition?”</blockquote>
<p class="reader-paragraph">And nothing settles.</p>
<p class="reader-paragraph">And slowly…</p>
<p class="reader-paragraph">you realize:</p>
<p class="reader-paragraph">The mind is not a decision-maker.</p>
<p class="reader-paragraph">It is a generator of possibilities.</p>
<p class="reader-paragraph">And possibilities are infinite.</p>
<p class="reader-paragraph">But clarity is not.</p>
